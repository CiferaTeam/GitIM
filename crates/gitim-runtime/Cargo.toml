[package]
name = "gitim-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gitim-client = { path = "../gitim-client" }
gitim-agent-provider = { path = "../gitim-agent-provider" }
gitim-core = { path = "../gitim-core" }
gitim-sync = { path = "../gitim-sync" }
gitim-updater = { path = "../gitim-updater" }
uuid = { version = "1", features = ["v4"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
regex = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "multipart"] }
dirs = "6"
axum = { version = "0.8", features = ["multipart"] }
async-trait = "0.1"
futures = "0.3"
fs2 = "0.4"
infer = "0.19"
imagesize = { version = "0.15", default-features = false, features = ["png", "jpeg", "gif", "webp", "heif"] }
mime = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { workspace = true, features = ["io"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
tiktoken-rs = "0.11.0"
libc = "0.2"
sha2 = { workspace = true }
clap = { version = "4", features = ["derive"] }
percent-encoding = "2"

[target.'cfg(target_os = "macos")'.dependencies]
xattr = "1"

[features]
# Gates test-only binaries, integration targets, and diagnostic APIs.
test-support = []

[[bin]]
name = "gitim-runtime"
path = "src/bin/runtime.rs"

# Test-only stand-in for `gitim-runtime`. The update E2E tarball is built
# around copies of this binary; the `CARGO_BIN_EXE_fake-gitim-runtime` env var
# lets the test locate the compiled artifact without hard-coding a target path.
#
# Gated behind the `test-support` feature so plain `cargo build --release`
# (or `cargo install --path`) does NOT drop this helper into the production
# artifact set. The `update_e2e` integration test declares the same feature
# via `required-features`, so the two travel together.
[[bin]]
name = "fake-gitim-runtime"
path = "tests/support/fake_runtime.rs"
test = false
doc = false
bench = false
required-features = ["test-support"]

[[test]]
name = "update_e2e"
path = "tests/update_e2e.rs"
required-features = ["test-support"]

[[test]]
name = "assets_store"
path = "tests/assets_store.rs"
required-features = ["test-support"]

[[test]]
name = "assets_http"
path = "tests/assets_http.rs"

[dev-dependencies]
serial_test = "3"
mockito = "1"
http-body-util = "0.1"

[target.'cfg(target_os = "macos")'.dev-dependencies]
xattr = "1"

[lints]
workspace = true
