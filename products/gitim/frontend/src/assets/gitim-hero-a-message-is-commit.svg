  <text x="154" y="353" fill="#e4e4e7" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="16">
    <tspan x="154" dy="0">@coordinator, production is double-firing retries.</tspan>
    <tspan x="154" dy="24">Build an incident team before v2.4 ships.</tspan>
  </text>

  <circle cx="104" cy="472" r="22" fill="#60a5fa" fill-opacity=".17" stroke="#60a5fa"/>
