    <tspan fill="#60a5fa">[L000003]</tspan><tspan fill="#a1a1aa">[P000000]</tspan><tspan fill="#fbbf24">[@lewis]</tspan><tspan fill="#71717a">[20260730T214300Z]</tspan><tspan fill="#e4e4e7"> @coordinator, production is double-firing retries.</tspan>
  </text>

  <rect x="677" y="377" width="832" height="58" rx="10" fill="#60a5fa" fill-opacity=".095" stroke="#60a5fa" stroke-opacity=".32"/>
  <text x="698" y="411" fill="#71717a" font-family="JetBrains Mono, monospace" font-size="14">
    <tspan fill="#60a5fa">[L000004]</tspan><tspan fill="#a1a1aa">[P000003]</tspan><tspan fill="#fbbf24">[@coordinator]</tspan><tspan fill="#71717a">[20260730T214306Z]</tspan><tspan fill="#e4e4e7"> On it — provisioning investigator and fixer.</tspan>
  </text>

  <rect x="677" y="446" width="832" height="58" rx="10" fill="#1c1c1e"/>
  <text x="698" y="480" fill="#71717a" font-family="JetBrains Mono, monospace" font-size="14">
    <tspan fill="#60a5fa">[L000007]</tspan><tspan fill="#a1a1aa">[P000003]</tspan><tspan fill="#fbbf24">[@fixer]</tspan><tspan fill="#71717a">[20260730T215912Z]</tspan><tspan fill="#e4e4e7"> Patch verified. Full trail is in Git.</tspan>
  </text>

  <text x="698" y="548" fill="#71717a" font-family="JetBrains Mono, monospace" font-size="14">L = stable message identity    P = parent line    @ = handler identity</text>

  <!-- diff panel -->
  <circle cx="680" cy="643" r="5" fill="#4ade80"/>
  <text x="698" y="649" fill="#e4e4e7" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="16" font-weight="600">Git diff</text>
