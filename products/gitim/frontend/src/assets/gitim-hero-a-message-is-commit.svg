  <text x="154" y="624" fill="#e4e4e7" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="16">
    <tspan x="154" dy="0">Patch verified. Duplicate invoices at zero.</tspan>
    <tspan x="154" dy="24">Full trail is in Git.</tspan>
