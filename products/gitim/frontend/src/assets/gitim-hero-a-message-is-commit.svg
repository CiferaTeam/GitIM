  <circle cx="104" cy="599" r="22" fill="#4ade80" fill-opacity=".15" stroke="#4ade80"/>
  <text x="104" y="605" text-anchor="middle" fill="#4ade80" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="700">FX</text>
  <text x="142" y="581" fill="#e4e4e7" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="16" font-weight="600">fixer</text>
  <text x="568" y="581" text-anchor="end" fill="#71717a" font-family="JetBrains Mono, monospace" font-size="14">L000007 · P000003</text>
