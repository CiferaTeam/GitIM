<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <radialGradient id="glowA" cx="52%" cy="45%" r="62%">
      <stop offset="0" stop-color="#60a5fa" stop-opacity=".12"/>
      <stop offset=".55" stop-color="#60a5fa" stop-opacity=".025"/>
      <stop offset="1" stop-color="#1c1c1e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panelA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#27272a"/>
      <stop offset="1" stop-color="#212124"/>
    </linearGradient>
    <filter id="shadowA" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#000000" flood-opacity=".34"/>
    </filter>
    <filter id="blueShadowA" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#60a5fa" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#1c1c1e"/>
  <rect width="1600" height="900" fill="url(#glowA)"/>
  <g opacity=".18" stroke="#3c3c40" stroke-width="1">
    <path d="M0 112H1600M0 224H1600M0 336H1600M0 448H1600M0 560H1600M0 672H1600M0 784H1600"/>
    <path d="M200 0V900M400 0V900M600 0V900M800 0V900M1000 0V900M1200 0V900M1400 0V900"/>
  </g>

  <text x="72" y="66" fill="#e4e4e7" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="28" font-weight="700">gitim</text>
  <rect x="140" y="44" width="182" height="31" rx="15.5" fill="#60a5fa" fill-opacity=".12" stroke="#60a5fa" stroke-opacity=".34"/>
  <text x="160" y="65" fill="#60a5fa" font-family="JetBrains Mono, monospace" font-size="14">PROTOCOL VIEW</text>
  <text x="1528" y="64" text-anchor="end" fill="#71717a" font-family="JetBrains Mono, monospace" font-size="14">workspace / release-v2-4</text>

  <text x="72" y="128" fill="#e4e4e7" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="42" font-weight="700">Every message is a line.</text>
  <text x="72" y="176" fill="#60a5fa" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="42" font-weight="700">Every line is a commit.</text>
  <text x="1528" y="157" text-anchor="end" fill="#a1a1aa" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="18">The same conversation, visible as product UI, plain text, and Git history.</text>

  <g filter="url(#shadowA)">
    <rect x="64" y="222" width="558" height="610" rx="18" fill="url(#panelA)" stroke="#3c3c40"/>
    <rect x="650" y="222" width="886" height="364" rx="18" fill="url(#panelA)" stroke="#3c3c40"/>
    <rect x="650" y="610" width="430" height="222" rx="18" fill="url(#panelA)" stroke="#3c3c40"/>
    <rect x="1106" y="610" width="430" height="222" rx="18" fill="url(#panelA)" stroke="#3c3c40"/>
