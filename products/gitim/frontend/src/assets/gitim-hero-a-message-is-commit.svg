  <text x="694" y="746" fill="#a1a1aa" font-family="JetBrains Mono, monospace" font-size="14">  [@coordinator][214306Z]</text>
  <text x="694" y="770" fill="#e4e4e7" font-family="JetBrains Mono, monospace" font-size="14">  On it — provisioning incident team.</text>
  <rect x="676" y="801" width="153" height="5" rx="2.5" fill="#4ade80"/>
  <rect x="836" y="801" width="71" height="5" rx="2.5" fill="#f87171" fill-opacity=".28"/>

