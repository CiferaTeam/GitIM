  <text x="592" y="260" text-anchor="end" fill="#71717a" font-family="JetBrains Mono, monospace" font-size="14">CHANNEL</text>
  <path d="M64 280H622" stroke="#2c2c30"/>

  <circle cx="104" cy="323" r="22" fill="#3b82f6"/>
  <text x="104" y="329" text-anchor="middle" fill="#fff" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="16" font-weight="700">L</text>
  <text x="142" y="310" fill="#e4e4e7" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="16" font-weight="600">lewis</text>
  <text x="568" y="310" text-anchor="end" fill="#71717a" font-family="JetBrains Mono, monospace" font-size="14">L000003</text>
